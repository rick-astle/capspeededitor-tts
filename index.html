<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Tools Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-link: #58a6ff;
            --accent-hover: #1f6feb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 650px;
            margin: 60px auto;
            padding: 0 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            margin-bottom: 24px;
        }

        .card-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .card-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 20px;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }

        .card-item:hover {
            border-color: var(--accent-link);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .card-link {
            font-weight: 600;
            color: var(--accent-link);
            text-decoration: none;
            font-size: 19px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .card-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .card-desc {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <h1>Web Tools Hub</h1>
    
    <ul class="card-list">
        <!-- FIXED: Space replaced with %20 to prevent 404 broken link -->
        <li class="card-item">
            <a class="card-link" href="local_client_side_text_to_speech_kokoro_tts%20333333.html">
                🗣️ Kokoro Text-to-Speech
            </a>
            <p class="card-desc">Local, client-side text-to-speech voice generator tool.</p>
        </li>
        
        <li class="card-item">
            <a class="card-link" href="capcut_curve_speed_editor.html">
                📈 CapCut Curve Speed Editor
            </a>
            <p class="card-desc">Interactive video speed ramping and velocity curve editor.</p>
        </li>
    </ul>

</body>
</html>
